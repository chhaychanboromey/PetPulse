events {
    worker_connections 1024;
}

http {
    keepalive_timeout 0;

    upstream pet_cluster {
        server pet-service-1:8003;
        server pet-service-2:8003;
    }

    server {
        listen 80;

        # Block favicons and icon requests so they don't consume round-robin steps
        location ~* \.(ico|png|jpg|jpeg|gif|css|js)$ {
            access_log off;
            log_not_found off;
            return 204;
        }

        # Web page route for browser verification
        location / {
            proxy_pass http://pet_cluster/demo/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Disable browser caching completely
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # API route for Postman
        location /api/ {
            proxy_pass http://api-gateway:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
        }
    }
}