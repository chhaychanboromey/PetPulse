apiVersion: v1
kind: Service
metadata:
  name: petpulse-apigateway-service
spec:
  type: NodePort
  selector:
    app: petpulse
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: petpulse-registration-service
spec:
  type: ClusterIP
  selector:
    app: petpulse-reg
  ports:
    - protocol: TCP
      port: 8001
      targetPort: 8001