services:
  nginx:
    image: nginx:latest
    container_name: petpulse-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - pet-service-1
      - pet-service-2
      - api-gateway

  api-gateway:
    build: ./API-Gateway
    container_name: petpulse-gateway
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - JWT_SECRET=2d649a9ea4e6aed305c193a43f3ecde951b2872e45cd44c61bd6ab5bb0547636
      - REGISTRATION_URL=http://registration:8001
      - LOGIN_URL=http://login:8002
      - APPOINTMENT_URL=http://appointment:8004
      - PRESCRIPTION_URL=http://prescription:8005
      - BILLING_URL=http://billing:8006
      - PET_NODE_1=http://pet-service-1:8003
      - PET_NODE_2=http://pet-service-2:8003
    depends_on:
      - registration
      - login
      - pet-service-1
      - pet-service-2
      - appointment
      - prescription
      - billing

  registration:
    build: ./Registration
    container_name: petpulse-registration
    ports:
